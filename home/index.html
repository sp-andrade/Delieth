<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delieth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen">

    <!-- Menu principal -->
    <aside class="bg-[#cc9199]/40 w-64 p-6 flex flex-col justify-between h-screen shadow-lg">
        <div>
            <h1 class="font-display text-4xl text-center text-[#662029] font-bold mb-10 px-2">Delieth</h1>

            <nav class="flex flex-col gap-5">
                <a href="#"
                    class="flex items-center gap-3 bg-[#662029] text-white transition hover:scale-105 duration-300 rounded-xl px-4 py-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M3 10.5 12 3l9 7.5" />
                        <path d="M5 9.5V21h14V9.5" />
                    </svg>
                    <span class="text-sm ">Inicio</span>
                </a>
                <a href="#"
                    class="flex items-center gap-3 text-wine-700 rounded-xl px-4 py-3 hover:bg-wine-100/60 hover:scale-105 transition duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path
                            d="M12 21s-7-4.35-9.5-8.5C.7 9 2.2 5 6 5c2 0 3.5 1.2 4 2.5C10.5 6.2 12 5 14 5c3.8 0 5.3 4 3.5 7.5C19.5 16.65 12 21 12 21Z" />
                    </svg>
                    <span class="text-sm">Favoritos</span>
                </a>
                <a href="#"
                    class="flex items-center gap-3 text-wine-700 rounded-xl px-4 py-3 hover:bg-wine-100/60 hover:scale-105 transition duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1" />
                        <circle cx="19" cy="21" r="1" />
                        <path d="M2.5 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6" />
                    </svg>
                    <span class="text-sm">Carrito</span>
                </a>
                <a href="#"
                    class="flex items-center gap-3 text-wine-700 rounded-xl px-4 py-3 hover:bg-wine-100/60 hover:scale-105 transition duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
                    </svg>
                    <span class="text-sm">Perfil</span>
                </a>
            </nav>
        </div>

        <a href="./index.html" class="flex items-center gap-3 text-wine-800 px-2 hover:scale-105 transition duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <path d="M16 17l5-5-5-5" />
                <path d="M21 12H9" />
            </svg>
            <span class="text-sm">Cerrar sesión</span>
        </a>
    </aside>

    <main class="flex-1 px-10 py-8">

        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <p class="text-2xl font-medium">Bienvenidos a Delieth</p>
                <h2 class="flex justify-center items-center">¿Qué postre deseas hoy?</h2>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-white rounded-full px-4 py-2 w-80 shadow-sm">
                    <input type="text" placeholder="¿Qué postre estás buscando?"
                        class="flex-1 bg-transparent outline-none text-sm placeholder:text-wine-200 text-wine-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-wine-600" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" />
                    </svg>
                </div>
                <button class="w-10 h-10 rounded-full bg-blush flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-wine-800" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" />
                    </svg>
                </button>
                <button class="w-10 h-10 rounded-full bg-blush flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-wine-800" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width"M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                </button>
            </div>
        </div>

</body>

</html>
